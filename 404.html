<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · e-Reactor</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ee;color:#1f2933;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
  .caja{max-width:460px;text-align:center}
  .mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0 auto 18px;background:#10263f;color:#f8fafc;font-weight:800;font-size:20px}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:-.5px}
  p{color:#5f6675;margin:0 0 22px;line-height:1.5}
  a{display:inline-block;background:#10263f;color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:12px}
</style>
</head>
<body>
<div class="caja">
  <div class="mark">eR</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace haya cambiado o que el recurso se haya movido.</p>
  <a id="ir" href="/">Ir al inicio de e-Reactor</a>
</div>
<script>
  // En GitHub Pages sin dominio propio el sitio vive en /nombre-del-repo/
  if (/\.github\.io$/.test(location.hostname)) {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg) document.getElementById('ir').href = '/' + seg + '/';
  }
</script>
</body>
</html>
